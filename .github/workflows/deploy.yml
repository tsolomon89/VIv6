name: Build and Deploy

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      ADMIN_KEY: ${{ secrets.ADMIN_KEY }}
      VITE_ADMIN_KEY: ${{ secrets.VITE_ADMIN_KEY }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'
        cache: 'npm'

    - name: Install Dependencies
      run: npm ci

    - name: Install UI Dependencies
      run: |
        cd src/ui
        npm ci

    - name: Run Unit Tests
      run: npm run test

    - name: Run Contract Invariant Suites
      run: npx vitest run tests/contract/L4_opportunity.test.ts tests/contract/invariants.test.ts

    - name: Run E2E Tests
      run: npm run test:e2e

    - name: Run UI Tests
      run: npm run test:ui

    - name: Verify API Docs Coverage
      run: npm run docs:verify

    - name: Verify Canonical Types
      run: npm run types:verify

    - name: Verify Drift Gates (G1-G8)
      run: npm run drift:verify

    - name: Build Web App (UI)
      run: |
        cd src/ui
        npm run build

    - name: Build Static Site
      run: npm run build

    - name: Verify All Seeded Brand Builds
      run: npm run build:verify:brands

    - name: Archive Production Artifact
      uses: actions/upload-artifact@v3
      with:
        name: deploy-dist
        path: dist/
